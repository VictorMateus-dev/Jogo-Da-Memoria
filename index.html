<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="Style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <div class="fumacas">
    <div class="fumaca" id="f1"></div>
    <div class="fumaca" id="f2"></div>
    <div class="fumaca" id="f3"></div>
    <div class="fumaca" id="f4"></div>
  </div>

  <div class="menu" id="menu">
  <span class="titulo"><img src="imagens/logo-gwent-big-en-7c21928f.png" alt="Logo do Gwent"></span>
  <button class="btn_iniciar" id="btn_iniciar">Iniciar Partida</button>
  <button class="btn_sair">Fechar o Jogo</button>
  </div>


  <section id="MontandoPartida">

        <div id="placar1" class="placar placar-esquerdo" hidden>
          <div class="avatar">
              <img class="foto" src="imagens/iconPlayer1.jpg" alt="Jogador 1">
              <img class="moldura"
                  src="imagens/avatar-mobile-frame-15168e3e.png"
                  alt="">
          </div>

          <p class="jogador">JOGADOR 1</p>
          <h2>PLAYER 1</h2>
          <div class="pontuacao">
              <strong id="pontos-player1" aria-live="polite">0</strong>
              <span>PONTOS</span>
          </div>
          <p id="status-player1" class="status ativo">SUA VEZ</p>
        </div>


        <div class="partida" id="partida" hidden></div>

        

        <div id="placar2" class="placar placar-direito" hidden>
            <div class="avatar">
                <img class="foto" src="imagens/iconPlayer2.jpg" alt="Jogador 2">
                <img class="moldura"
                    src="imagens/avatar-mobile-frame-15168e3e.png"
                    alt="">
            </div>

            <p class="jogador">JOGADOR 2</p>
          <h2>PLAYER 2</h2>
          <div class="pontuacao">
              <strong id="pontos-player2" aria-live="polite">0</strong>
              <span>PONTOS</span>
          </div>
          <p id="status-player2" class="status">AGUARDANDO</p>
        </div>

  </section>
  
</body>


</html>
